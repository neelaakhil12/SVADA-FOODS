<!DOCTYPE html>
<html>
<body>
  <canvas id="canvas" style="display:none;"></canvas>
  <div id="color" style="font-size: 24px; font-family: monospace;">Loading...</div>
  <script>
    const img = new Image();
    img.src = '/logo.png';
    img.onload = () => {
      const canvas = document.getElementById('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      // Sample top-left corner pixel color
      const data = ctx.getImageData(5, 5, 1, 1).data;
      const r = data[0];
      const g = data[1];
      const b = data[2];
      const hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      document.getElementById('color').innerText = hex + ' (rgba: ' + r + ',' + g + ',' + b + ',' + data[3] + ')';
    };
  </script>
</body>
</html>
